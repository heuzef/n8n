name: Deploy
# Every push to main redeploys the n8n VM over SSH.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deployments against the same VM at once.
concurrency:
  group: deploy-n8n-vm
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to n8n VM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          # Optional secret: falls back to the standard SSH port.
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 25m
          script: |
            set -eu
            cd /root/n8n
            git fetch --prune origin
            git reset --hard origin/main
            echo "Hello from Workflow !"
            # No -v: that would delete the volumes, and with them every workflow and credential. .env is gitignored, so the reset above leaves it alone.
            docker compose down
            docker compose pull
            docker compose up -d
