name: n8n

services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    # Pinned: n8nio/runners must run the exact same version (see the task-runners service).
    image: n8nio/n8n:2.38.6
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${N8N_BIND_ADDRESS}:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set it in .env}
      N8N_HOST: ${N8N_HOST:?set it in .env}
      N8N_PROTOCOL: https
      N8N_WEBHOOK_URL: https://${N8N_HOST}/
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Paris}
      TZ: ${GENERIC_TIMEZONE:-Europe/Paris}
      # Code node runs in the task-runners sidecar, not as a child process of n8n.
      N8N_RUNNERS_MODE: external
      # Shared secret the sidecar presents to the broker. Same value on both containers.
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?set it in .env}
      # The broker listens on localhost by default, which the sidecar can't reach.
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      # Real Python 3 runner: the Code node's Python mode needs it.
      N8N_NATIVE_PYTHON_RUNNER: "true"
    volumes:
      - n8n_data:/home/node/.n8n

  # Launcher + JavaScript and Python task runners. Its version must match n8n's.
  task-runners:
    image: n8nio/runners:2.38.6
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      # Broker port 5679 stays on the internal Compose network, never published.
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?set it in .env}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Paris}
      TZ: ${GENERIC_TIMEZONE:-Europe/Paris}

volumes:
  postgres_data:
  n8n_data:
